name: CI

on:
  push:
  pull_request:

jobs:
  pure-dart:
    name: Engine, protocol, relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: recurrence_engine
        working-directory: packages/recurrence_engine
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
          TZ=America/New_York dart test
      - name: sync_protocol
        working-directory: packages/sync_protocol
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: sync relay
        working-directory: server
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
