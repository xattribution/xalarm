name: recurrence_engine
description: >-
  Pure-Dart recurrence engine for shift-aware alarms (Panama and other rotating
  schedules, interval, weekly, monthly-ordinal) with start/end/count bounds.
version: 0.1.0
publish_to: 'none'

environment:
  # ^3.12.0 (not .2) so the package resolves on any Flutter 3.44.x — the
  # Docker builder image's `stable` tag can lag a patch release behind.
  sdk: ^3.12.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.31.0
