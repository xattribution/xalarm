name: xalarm_sync_server
description: >-
  In-memory WebSocket relay for xalarm time-sync sessions. Nothing is
  persisted: sessions, names, and codes live in RAM and are purged when a
  pairing ends.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0

dependencies:
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  sync_protocol:
    path: ../packages/sync_protocol

dev_dependencies:
  lints: ^5.0.0
  test: ^1.31.0
