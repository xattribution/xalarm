<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xalarm — download</title>
<style>
  :root {
    --bg: #0E1116;
    --surface: #171A1F;
    --surface-hi: #1E232B;
    --blue: #3B6FE0;
    --tan: #CBAE86;
    --text: #F2F4F7;
    --muted: #9AA4B2;
    --divider: #262B33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .logo {
    font-size: 40px;
    margin-bottom: 8px;
    color: var(--tan);
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .tagline {
    color: var(--muted);
    font-size: 14px;
    margin: 6px 0 24px;
  }
  .btn {
    display: block;
    background: var(--blue);
    color: #fff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 20px;
  }
  .btn:active { opacity: 0.85; }
  .meta {
    background: var(--surface-hi);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }
  .meta b { color: var(--tan); font-weight: 600; }
  .hint {
    border-top: 1px solid var(--divider);
    padding-top: 16px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.55;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">&#9200;</div>
    <h1>xalarm</h1>
    <p class="tagline">Shift-aware alarms &middot; Panama &amp; rotating schedules</p>

    <a class="btn" href="xalarm.apk" download>Download xalarm.apk</a>

    <div class="meta" id="meta">loading build info&hellip;</div>

    <div class="hint">
      <b>Install:</b> open the downloaded APK and allow
      &ldquo;install unknown apps&rdquo; for your browser if prompted.
      On first launch, grant the notification and alarms &amp; reminders
      permissions so alarms ring reliably.
    </div>
  </div>

  <script>
    fetch('version.json')
      .then(function (r) { return r.json(); })
      .then(function (v) {
        document.getElementById('meta').innerHTML =
          'build <b>' + v.commit + '</b> &middot; ' + v.date;
      })
      .catch(function () {
        document.getElementById('meta').textContent = 'build info unavailable';
      });
  </script>
</body>
</html>
