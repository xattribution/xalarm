<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xalarm — download</title>
<style>
  :root {
    --bg: #0E1116;
    --surface: #171A1F;
    --surface-hi: #1E232B;
    --blue: #3B6FE0;
    --tan: #CBAE86;
    --text: #F2F4F7;
    --muted: #9AA4B2;
    --divider: #262B33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .logo {
    display: block;
    margin: 0 auto 10px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .tagline {
    color: var(--muted);
    font-size: 14px;
    margin: 6px 0 24px;
  }
  .btn {
    display: block;
    background: var(--blue);
    color: #fff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 20px;
  }
  .btn:active { opacity: 0.85; }
  .meta {
    background: var(--surface-hi);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }
  .meta b { color: var(--tan); font-weight: 600; }
  .hint {
    border-top: 1px solid var(--divider);
    padding-top: 16px;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.55;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- The app icon's hourglass, inlined so the page needs no extra fetch. -->
    <svg class="logo" width="44" height="44" viewBox="0 0 44 44" fill="none"
         aria-hidden="true">
      <rect x="9" y="3" width="26" height="4" rx="2" fill="#8A7350"/>
      <rect x="9" y="37" width="26" height="4" rx="2" fill="#8A7350"/>
      <path d="M13.5 7.8h17v3.4c0 4.6-3.8 7.5-6.7 9.6l-1.5 1.2 1.5 1.2
               c2.9 2.1 6.7 5 6.7 9.6v3.4h-17v-3.4c0-4.6 3.8-7.5 6.7-9.6
               l1.5-1.2-1.5-1.2c-2.9-2.1-6.7-5-6.7-9.6V7.8z"
            stroke="#5A6E96" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M16.8 12.4h10.4c-.5 2.8-2.8 4.6-5.2 6.2-2.4-1.6-4.7-3.4-5.2-6.2z"
            fill="#CBAE86"/>
      <rect x="21.55" y="20.5" width="0.9" height="8.5" fill="#CBAE86"/>
      <path d="M15.6 34.8c1.8-4 4.4-5.9 6.4-6.9 2 1 4.6 2.9 6.4 6.9h-12.8z"
            fill="#CBAE86"/>
    </svg>
    <h1>xalarm</h1>
    <p class="tagline">Shift-aware alarms &middot; Panama &amp; rotating schedules</p>

    <a class="btn" href="xalarm.apk" download>Download xalarm.apk</a>

    <div class="meta" id="meta">loading build info&hellip;</div>

    <div class="hint">
      <b>Install:</b> open the downloaded APK and allow
      &ldquo;install unknown apps&rdquo; for your browser if prompted.
      On first launch, grant the notification and alarms &amp; reminders
      permissions so alarms ring reliably.
    </div>
  </div>

  <script>
    fetch('version.json')
      .then(function (r) { return r.json(); })
      .then(function (v) {
        document.getElementById('meta').innerHTML =
          'build <b>' + v.commit + '</b> &middot; ' + v.date;
      })
      .catch(function () {
        document.getElementById('meta').textContent = 'build info unavailable';
      });
  </script>
</body>
</html>
