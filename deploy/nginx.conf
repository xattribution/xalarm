server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve APKs with the proper Android mime type so browsers download and
    # hand off to the package installer instead of showing binary text.
    types {
        application/vnd.android.package-archive apk;
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/png png;
        image/svg+xml svg;
    }

    # The page and version manifest must never be cached — every redeploy
    # should show the new build info immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Clean URL for the Play Store privacy-policy link.
    location = /privacy {
        try_files /privacy.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
